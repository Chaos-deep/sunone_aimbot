# ============================================================
#  Sunone Aimbot 配置文件（中文注释版）
#
#  布尔值说明：true / 1 / yes / on  表示「开启」
#             false / 0 / no / off 表示「关闭」
#
#  修改保存后，按 F4 键（hotkey_reload_config）可热重载配置，
#  无需重启程序。
# ============================================================

[Detection window]
# 检测窗口宽度（像素）。程序只分析屏幕中心这一小块区域，数值越大越耗性能。
detection_window_width = 320
# 检测窗口高度（像素）。
detection_window_height = 320
# 是否把检测窗口裁成圆形（只保留中心圆形区域、四周留黑），可减少边缘误检。
circle_capture = True

[Capture Methods]
# 截图/采集帧率（FPS）。越高越流畅但越占资源，过高还可能导致瞄准抖动。
capture_fps = 60
# 是否使用 BetterCam 采集（Windows 专用，低延迟高性能屏幕捕获）。
# 注意：下面三种采集方式只能同时启用一种。
bettercam_capture = False
# BetterCam 使用的显示器编号。
bettercam_monitor_id = 0
# BetterCam 使用的 GPU 编号。
bettercam_gpu_id = 0
# 是否使用 OBS 虚拟摄像头作为画面来源。
obs_capture = False
# OBS 虚拟摄像头的设备编号。
obs_camera_id = 1
# 是否使用 MSS 采集（跨平台通用，当前默认开启）。
mss_capture = True

[Aim]
# 瞄准身体时的纵向偏移量（相对身体框高度的比例）。正值向下偏移，负值向上偏移。
body_y_offset = 0.1
# 是否隐藏（不瞄准）「躲藏点/非玩家」类目标，具体按 model_classes 里的 NON_TARGET_CLASS_IDS 判定。
hideout_targets = True
# 是否关闭爆头（关闭后只瞄准身体，不瞄准头部）。
disable_headshot = False
# 是否关闭移动预判（关闭后不再根据目标运动轨迹提前量瞄准）。
disable_prediction = False
# 移动预判的时间间隔（秒），用于推算目标下一时刻的位置。
prediction_interval = 2.0

[Hotkeys]
# 触发瞄准的热键（按住期间持续瞄准）。当前为鼠标右键，可填多个、用逗号分隔。
hotkey_targeting = RightMouseButton
# 退出程序的热键。
hotkey_exit = F2
# 暂停 / 恢复瞄准的热键。
hotkey_pause = F3
# 重载配置文件的热键。
hotkey_reload_config = F4

[Mouse]
# 鼠标 DPI，用于把屏幕像素位移换算成鼠标移动量。
mouse_dpi = 1100
# 游戏内鼠标灵敏度，用于移动距离换算。
mouse_sensitivity = 3.0
# 瞄准移动的 FOV 宽度（用于移动量换算，需与游戏视野匹配）。
mouse_fov_width = 40
# 瞄准移动的 FOV 高度（用于移动量换算）。
mouse_fov_height = 40
# 鼠标移动的最小速度倍率。
mouse_min_speed_multiplier = 1.0
# 鼠标移动的最大速度倍率。
mouse_max_speed_multiplier = 1.5
# 是否锁定目标（锁定后持续跟踪同一目标，不随意切换）。
mouse_lock_target = False
# 是否自动瞄准（无需按热键，检测到目标即自动移动鼠标）。
mouse_auto_aim = False
# 是否使用罗技 GHUB 驱动移动鼠标（Windows 专用）。
mouse_ghub = False
# 是否使用雷蛇（Razer）驱动移动鼠标（Windows 专用）。
# 注意：移动方式（标准 win32 / GHUB / Razer / Arduino）只能同时启用一种。
mouse_rzr = False

[Shooting]
# 是否自动开火（瞄准到目标时自动射击）。
auto_shoot = False
# 是否启用触发自瞄（准星对准目标的瞬间自动开火）。
triggerbot = False
# 是否强制点击（强制模拟按下射击键）。
force_click = False
# 开镜（狙击镜）灵敏度倍率。
bscope_multiplier = 1.0

[Arduino]
# 是否用 Arduino 模拟鼠标移动（硬件级输入，可绕过部分检测）。
arduino_move = False
# 是否用 Arduino 模拟射击。
arduino_shoot = False
# Arduino 串口（例如 COM3，填 auto 可自动查找）。
arduino_port = auto
# Arduino 串口波特率。
arduino_baudrate = 9600
# 是否使用 16 位鼠标协议（用于部分支持更大位移的固件）。
arduino_16_bit_mouse = False

[AI]
# AI 模型文件名（放在 models/ 目录下，支持 .pt / .engine / .onnx 等格式）。
ai_model_name = sunxds_0.8.0.pt
# 模型输入分辨率（像素）。640 为标准值，越大越慢、越准。
ai_model_image_size = 640
# 检测置信度阈值（0~1）。越小越容易识别目标，但误报也越多。
ai_conf = 0.2
# 推理设备。0 表示第一块 NVIDIA 显卡，cpu 表示用 CPU，cuda:0 可指定具体显卡。
ai_device = 0
# 是否启用 AMD 显卡加速（ROCm / DirectML 等）。
ai_enable_amd = False
# 是否禁用目标跟踪器（ByteTrack）。
disable_tracker = False

[overlay]
# 是否显示叠加层（画在游戏画面上的透明瞄准辅助层）。
show_overlay = False
# 叠加层是否显示检测区域边框。
overlay_show_borders = True
# 叠加层是否显示目标框。
overlay_show_boxes = False
# 叠加层是否显示瞄准线（准星到目标的连线）。
overlay_show_target_line = False
# 叠加层是否显示预判瞄准线。
overlay_show_target_prediction_line = False
# 叠加层是否显示类别标签。
overlay_show_labels = False
# 叠加层是否显示置信度。
overlay_show_conf = False

[Debug window]
# 是否显示 OpenCV 调试窗口。
show_window = True
# 是否在调试窗口显示处理耗时（预处理 / 推理 / 后处理）。
show_detection_speed = True
# 是否在调试窗口显示 FPS。
show_window_fps = False
# 是否在调试窗口绘制目标框。
show_boxes = True
# 是否在调试窗口显示类别标签。
show_labels = False
# 是否在调试窗口显示置信度。
show_conf = True
# 是否在调试窗口显示瞄准线。
show_target_line = False
# 是否在调试窗口显示预判线。
show_target_prediction_line = False
# 是否在调试窗口显示开镜判定框。
show_bscope_box = False
# 是否在调试窗口显示目标历史轨迹点。
show_history_points = False
# 调试窗口是否置顶。
debug_window_always_on_top = True
# 调试窗口初始 X 坐标。
spawn_window_pos_x = 100
# 调试窗口初始 Y 坐标。
spawn_window_pos_y = 100
# 调试窗口缩放百分比（100 为原始大小）。
debug_window_scale_percent = 100
# 保存截图的快捷键。
debug_window_screenshot_key = End
